[project]
name = "docsqa"
version = "0.1.0"
description = "Evaluated RAG assistant over the DhanHQ trading API docs"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "openai>=1.50",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.3",
    "torch>=2.4",
    "datasets>=3.0",
    "accelerate>=1.0",
    "rank-bm25>=0.2.2",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "tiktoken>=0.8",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38", "requests>=2.32"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docsqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
